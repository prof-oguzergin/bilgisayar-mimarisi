% =============================================================
% Bilgisayar Mimarisi — tex4ebook (tex4ht) EPUB yapılandırması
% Kullanım: tex4ebook -l -f epub3 -c ana-kitap-epub.cfg ana-kitap.tex
% =============================================================
\Preamble{xhtml}

% --- EPUB üstverisi ---
\Configure{DocumentLanguage}{tr}
\Configure{SafeTitle}{Bilgisayar Mimarisi — RISC-V Tabanlı Yaklaşım}
\Configure{CoverMimeType}{image/jpeg}

% --- TikZ şekilleri (pgfplots dahil) SVG görsele çevrilir ---
% Şekil içindeki tabular'lar doğal (HTML olmayan) haliyle dizilmelidir;
% tex4ht'nin tablo kancaları resim süresince geri alınır (\HRestore yereldir).
\Configure{Picture}{.svg}
% epub_in_picture bayrağı preamble'daki Lua sarmalayıcıyı yönetir
% (şekil içinde Türkçe karakterlerin 'x'e çevrilmesini engeller).
\makeatletter
\ConfigureEnv{tikzpicture}
  {\Picture*{}%
   \directlua{epub_in_picture=true}%
   \HRestore\halign
   \HRestore\noalign
   \HRestore\@array
   \HRestore\array
   \HRestore\endarray
   \HRestore\endtabular}
  {\directlua{epub_in_picture=false}\EndPicture}{}{}
\makeatother

% Resme çevrilen matematik (denklemler) için de aynı bayrak açılıp kapanır.
% PicMath gövdesi html4.4ht'deki taban hizalama mantığını aynen korur.
\ExplSyntaxOn
\Configure{PicMath}
{\directlua{epub_in_picture=true}\setbox0=}
{\Css{img[src="\PictureFile"]{%
  vertical-align:-\fp_eval:n{ \dim_to_fp:n{\dp0}/(\dim_to_fp:n{\ht0}+\dim_to_fp:n{\dp0}) * 100}\%
}}\box0\directlua{epub_in_picture=false}}
{}
{ class="math" }
\ExplSyntaxOff
\Configure{PicDisplay}
  {\directlua{epub_in_picture=true}%
   \edef\MathPar{\ifvmode par-\fi}\IgnorePar\endgraf\EndP
   \HCode{<div class="\MathPar math-display">}}
  {\HCode{</div>}\par\ShowPar\directlua{epub_in_picture=false}}  {}  {class="\MathPar math-display" }

% --- Kutu ortamları: CSS ile stillenen div sınıfları ---
\ConfigureEnv{ornek}
  {\ifvmode\IgnorePar\fi\EndP\HCode{<div class="kutu ornek">}}
  {\ifvmode\IgnorePar\fi\EndP\HCode{</div>}}{}{}
\ConfigureEnv{tanim}
  {\ifvmode\IgnorePar\fi\EndP\HCode{<div class="kutu tanim">}}
  {\ifvmode\IgnorePar\fi\EndP\HCode{</div>}}{}{}
\ConfigureEnv{tcolorbox}
  {\ifvmode\IgnorePar\fi\EndP\HCode{<div class="kutu hedef">}}
  {\ifvmode\IgnorePar\fi\EndP\HCode{</div>}}{}{}
\ConfigureEnv{bilginotuic}
  {\ifvmode\IgnorePar\fi\EndP\HCode{<div class="kutu bilginot">}}
  {\ifvmode\IgnorePar\fi\EndP\HCode{</div>}}{}{}
\ConfigureEnv{terimnotu}
  {\ifvmode\IgnorePar\fi\EndP\HCode{<div class="kutu terimnotu">}}
  {\ifvmode\IgnorePar\fi\EndP\HCode{</div>}}{}{}
\ConfigureEnv{karsilastirma}
  {\ifvmode\IgnorePar\fi\EndP\HCode{<div class="kutu karsilastirma">}}
  {\ifvmode\IgnorePar\fi\EndP\HCode{</div>}}{}{}
\ConfigureEnv{alistirma}
  {\ifvmode\IgnorePar\fi\EndP\HCode{<div class="alistirma">}}
  {\ifvmode\IgnorePar\fi\EndP\HCode{</div>}}{}{}

% --- CSS ---
% Kutu renkleri PDF'teki tcolorbox paletiyle uyumludur.
\Css{img { max-width: 100\%; height: auto; }}
\Css{div.kutu { border: 1px solid \#bbbbbb; border-left: 5px solid \#004785; border-radius: 4px; padding: 0.4em 0.9em; margin: 1em 0; }}
\Css{div.ornek { border-left-color: \#004785; background-color: \#eef3f8; }}
\Css{div.hedef { border-left-color: \#004785; background-color: \#eef3f8; }}
\Css{div.tanim { border-left-color: \#cc7a00; background-color: \#fdf6ec; }}
\Css{div.bilginot { border-left-color: \#2e8b2e; background-color: \#eefaee; }}
\Css{div.terimnotu { border-left-color: \#8b5a2b; background-color: \#f9f3ec; }}
\Css{div.karsilastirma { border-left-color: \#643c96; background-color: \#f4effa; }}
\Css{div.alistirma { margin: 0.8em 0; }}
\Css{pre { white-space: pre-wrap; font-size: 0.85em; }}

\begin{document}
\EndPreamble
